<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Prueba de VRM - Waifu VTuber</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            bottom: 20px;
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
        }
        button {
            padding: 10px 15px;
            background: #e91e63;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #c2185b; }
    </style>
</head>
<body>
    <div id="ui">
        <h3>Waifu 3D (VRM) Cargada!</h3>
        <p>Mueve el ratón para que te mire.</p>
        <button id="talkBtn">Hacer que hable (Prueba de Lip Sync)</button>
    </div>

    <!-- Import Map para cargar Three.js y three-vrm fácilmente -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.167.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.167.0/examples/jsm/",
          "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@3.2.0/lib/three-vrm.module.js"
        }
      }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

        // 1. Configurar Escena
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const camera = new THREE.PerspectiveCamera(30.0, window.innerWidth / window.innerHeight, 0.1, 20.0);
        camera.position.set(0.0, 1.4, 1.5); // Posición enfocada en el pecho/cara

        const scene = new THREE.Scene();

        const light = new THREE.DirectionalLight(0xffffff, 1.0);
        light.position.set(1.0, 1.0, 1.0).normalize();
        scene.add(light);
        scene.add(new THREE.AmbientLight(0xaaaaaa));

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.screenSpacePanning = true;
        controls.target.set(0.0, 1.4, 0.0);
        controls.update();

        // 2. Cargar el Modelo VRM
        let currentVrm = undefined;
        const loader = new GLTFLoader();
        loader.crossOrigin = 'anonymous';

        // Instalar el plugin de VRM al cargador
        loader.register((parser) => {
            return new VRMLoaderPlugin(parser);
        });

        loader.load(
            '/static/models/sample.vrm', 
            (gltf) => {
                const vrm = gltf.userData.vrm;

                // Evitar que el modelo se vea oscuro y corregir rotaciones
                VRMUtils.removeUnnecessaryVertices(gltf.scene);
                VRMUtils.removeUnnecessaryJoints(gltf.scene);

                scene.add(vrm.scene);
                currentVrm = vrm;
                
                // Rotar para mirar a cámara si es necesario
                vrm.scene.rotation.y = Math.PI;

                console.log('VRM Cargado con exito!');
            },
            (progress) => console.log('Cargando: ', 100.0 * (progress.loaded / progress.total), '%'),
            (error) => console.error(error)
        );

        // 3. Animación y Mirada
        const clock = new THREE.Clock();
        let targetLookAt = new THREE.Vector2();

        // Seguir el raton
        window.addEventListener('mousemove', (event) => {
            targetLookAt.x = 2.0 * (event.clientX / window.innerWidth) - 1.0;
            targetLookAt.y = -2.0 * (event.clientY / window.innerHeight) + 1.0;
        });

        let isTalking = false;

        document.getElementById('talkBtn').addEventListener('mousedown', () => isTalking = true);
        document.getElementById('talkBtn').addEventListener('mouseup', () => isTalking = false);
        document.getElementById('talkBtn').addEventListener('mouseleave', () => isTalking = false);

        function animate() {
            requestAnimationFrame(animate);

            const deltaTime = clock.getDelta();

            if (currentVrm) {
                // Actualizar físicas (pelo, ropa)
                currentVrm.update(deltaTime);

                // Hacer que siga el ratón
                if (currentVrm.lookAt) {
                    currentVrm.lookAt.applier.yaw = targetLookAt.x * 30; // grados
                    currentVrm.lookAt.applier.pitch = targetLookAt.y * 30;
                }

                // Simular hablar abriendo y cerrando la boca
                if (currentVrm.expressionManager) {
                    if (isTalking) {
                        // Simulación simple de volumen abriendo y cerrando boca
                        const volumeMock = (Math.sin(Date.now() / 50) + 1) / 2; 
                        currentVrm.expressionManager.setValue('aa', volumeMock);
                        currentVrm.expressionManager.setValue('blink', 0); // No parpadear mientras habla fuerte
                    } else {
                        currentVrm.expressionManager.setValue('aa', 0);
                        
                        // Parpadeo aleatorio
                        const blink = Math.sin(Date.now() / 500) > 0.95 ? 1 : 0;
                        currentVrm.expressionManager.setValue('blink', blink);
                    }
                    currentVrm.expressionManager.update();
                }
            }

            renderer.render(scene, camera);
        }

        animate();

        // Responsive
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
